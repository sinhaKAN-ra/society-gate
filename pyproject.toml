[project]
name = "society-gate"
version = "0.1.0"
description = "Resident-controlled society visitor companion with an Alexa adapter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[project.scripts]
society-gate = "society_gate.server:main"

[tool.setuptools]
packages = ["society_gate"]

[tool.setuptools.package-data]
society_gate = ["web/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
